name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: pacman
            files: dist/*.pkg.tar.zst
          - os: windows-latest
            platform: win
            artifact: windows
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      - run: npm run dist:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release
          merge-multiple: true
      - name: Check files and write checksums
        run: |
          test "$(find release -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          cd release
          sha256sum *.pkg.tar.zst *.exe > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "SoundCloud Desktop ${GITHUB_REF_NAME#v}" --notes-file "release-notes/$GITHUB_REF_NAME.md" --verify-tag
