name: Check

on:
  push:
  pull_request:

jobs:
  syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Install UI test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run check
      - run: npm test
      - name: UI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ui
      - name: UI smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:ui
